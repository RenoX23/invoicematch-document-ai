name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: invoicematch_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install package and verification tools
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check
        run: python -m mypy src
      - name: Test
        env:
          INVOICEMATCH_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/invoicematch_test
        run: python -m pytest
      - name: Verify the captured model responses offline
        env:
          GROQ_API_KEY: ""
        run: python -m invoicematch.benchmark --mode replay --capture benchmarks/phase2-groq.json
      - name: Build the local reviewer image
        run: docker compose build
