[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "invoicematch"
version = "0.1.0"
description = "Evidence-backed invoice and purchase-order reconciliation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.13.5",
    "pypdf==7.1.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "mypy==2.4.1", "pytest==9.1.1", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoicematch = ["samples/*.pdf", "samples/*.json", "web/*.html", "web/*.js", "web/*.css", "web/*.woff2", "web/*-OFL.txt", "web/favicon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
