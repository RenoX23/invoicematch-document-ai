services:
  reviewer:
    build: .
    environment:
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      INVOICEMATCH_SECURE_COOKIE: "${INVOICEMATCH_SECURE_COOKIE:-0}"
    ports:
      - "127.0.0.1:${INVOICEMATCH_PORT:-8000}:8000"
    volumes:
      - reviews:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  reviews:
